[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pickpoint"
version = "2.0.1"
description = "Official Python SDK for Pickpoint — geocoding, routing, devices, and realtime tracking"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Pickpoint" }]
keywords = ["geocoding", "routing", "tracking", "maps", "gps"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "websockets>=14",
  "protobuf>=5",
  "grpcio>=1.68",
]

[project.urls]
Homepage = "https://pickpoint.io"
Documentation = "https://pickpoint.io/docs"
Repository = "https://github.com/pickpoint/python-sdk"
Issues = "https://github.com/pickpoint/python-sdk/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "grpcio-tools>=1.68",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pickpoint"]

[tool.hatch.build.targets.wheel.sources]
"src/pickpoint" = "pickpoint"

[tool.hatch.build]
include = [
  "src/pickpoint/**/*.py",
  "src/pickpoint/py.typed",
  "LICENSE",
  "README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
